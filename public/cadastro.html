<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Biblioteca Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="img/logo.jpg">
</head>
<body>
    

<div class="auth-split">
    <div class="auth-image" style="background-image: url('img/auth-bg.jpg');">
        <div class="auth-quote">
            <p>"A leitura é para o intelecto o que o exercício é para o corpo."</p>
            <span>- Joseph Addison</span>
        </div>
    </div>
    
    <div class="auth-form-side">
        <div class="auth-form-container">
            <img src="img/logo.jpg" alt="Logo" class="auth-logo">
            <h1 class="auth-title">Crie sua Conta</h1>
            <p class="auth-subtitle">Junte-se a milhares de leitores na nossa biblioteca.</p>
            
            <form id="cadastroForm">
                <div class="modern-form-group">
                    <label for="nome">Nome Completo</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="nome" class="modern-input" placeholder="Seu nome oficial" required>
                    </div>
                </div>
                
                <div class="modern-form-group">
                    <label for="email">Endereço de E-mail</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" class="modern-input" placeholder="exemplo@academico.com" required>
                    </div>
                </div>
 
                <div class="modern-form-group">
                    <label for="telefone">Telefone</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <input type="tel" id="telefone" class="modern-input" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="modern-form-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="confirmarSenha" class="modern-input has-toggle" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="togglePasswordConfirm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
               
                <div class="modern-form-group">
                    <label for="senha">Criar Senha</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="senha" class="modern-input has-toggle" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-auth">Finalizar Cadastro</button>
            </form>
            
            <div class="auth-footer-links">
                <a href="index.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Voltar
                </a>
                <a href="login.html">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>
</div>
    
<div id="notificacao"></div>
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>

</body>
</html>
