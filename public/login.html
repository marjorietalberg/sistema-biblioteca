<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="img/logo.jpg">
</head>
<body>
    

<div class="auth-split">
    <div class="auth-image" style="background-image: url('img/auth-bg.jpg');">
        <div class="auth-quote">
            <p>"A leitura é para o intelecto o que o exercício é para o corpo."</p>
            <span>- Joseph Addison</span>
        </div>
    </div>
    
    <div class="auth-form-side">
        <div class="auth-form-container">
            <img src="img/logo.jpg" alt="Logo" class="auth-logo">
            <h1 class="auth-title">Bem-vindo de volta!</h1>
            <p class="auth-subtitle">Acesse sua conta para continuar sua leitura.</p>
            
            <form id="loginForm">
                <div class="modern-form-group">
                    <label for="email">Endereço de E-mail</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" class="modern-input" placeholder="exemplo@academico.com" required>
                    </div>
                </div>
                
                <div class="modern-form-group">
                    <label for="senha">Sua Senha</label>
                    <div class="modern-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="modern-input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="senha" class="modern-input has-toggle" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-auth">Entrar no Sistema</button>
            </form>
            
            <div class="auth-footer-links">
                <a href="index.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Voltar
                </a>
                <a href="cadastro.html">Criar uma conta grátis</a>
            </div>
        </div>
    </div>
</div>
    
<div id="notificacao"></div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
